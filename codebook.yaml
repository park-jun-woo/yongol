    ssac-openapi: "SSaC 함수명 ↔ operationId, @response 필드 매칭"
    states: "상태 다이어그램 ↔ SSaC/DDL/OpenAPI 교차"
    policy-check: "OPA Rego 정책 ↔ SSaC/DDL/States 교차"
    scenario-check: "Hurl 시나리오 ↔ OpenAPI 경로 검증"
    func-check: "SSaC @func/@call ↔ func spec 교차"
    ddl-coverage: "DDL 테이블이 SSaC에서 참조되는지 커버리지"
    func-coverage: "func spec이 SSaC @call에서 참조되는지 커버리지"
    config-check: "manifest.yaml claims/roles/middleware ↔ SSaC/Rego"
    queue-check: "publish ↔ subscribe 토픽 교차, 설정 검증"
    authz-check: "SSaC @auth 입력 ↔ authz CheckRequest 필드"
    sensitive: "DDL 컬럼 민감 패턴 감지"
