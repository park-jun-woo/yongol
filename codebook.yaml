    ddl-structural: "DDL 구조 검증 + 민감 패턴 주석 (D-*, XDD-*)"
    ssac-structural: "SSaC 필수 필드/변수 흐름/@subscribe 제약/pub-sub 쌍 (S-*, XSS-*)"
    statemachine-structural: "Mermaid stateDiagram 파싱 검증 (ST-*)"
    rego-structural: "Rego 파싱 + @ownership 어노테이션 (P-*, XPP-*)"
    funcspec-structural: "Func 스펙 구조 + 본체/import 제약 (F-*, XFF-*)"
    hurl-structural: "Hurl deprecated 확장자 감지 (H-*)"
    query-structural: "SQL 쿼리 구조 검증 (Q-* 규칙) — pkg/validate/query"
    manifest-cors: "manifest CORS 설정 검증 — pkg/validate/manifest/cors_01_wildcard_credentials.go"
    manifest-observability: "manifest backend.observability.metrics 검증 — pkg/validate/manifest/obs_*.go"
    observability: "Prometheus 메트릭 생성기/미들웨어 — pkg/generate/gogin/middleware/*prometheus*.go, pkg/generate/gogin/boot/*prometheus*.go"
    timing-defense: "타이밍 공격 방어 패턴 (예: verifyPassword 전/후 일정 지연) — pkg/parser/ssac/parse_verify_password.go"
    # --- pkg/validate pair-check topics (cross-SSOT) ---
    model-structural: "model/ 디렉토리 존재·기본 구조 검증 (M-*)"
    ssac-func: "SSaC @call ↔ Func 스펙 (Request/Response 필드, 타입, result 바인딩)"
    ssac-manifest: "SSaC currentUser/auth 참조 ↔ manifest claims/middleware/queue 요구"
    ssac-rego: "SSaC @auth action·resource ↔ Rego allow rule 매칭"
    ssac-sqlc: "SSaC Inputs 키 ↔ sqlc 쿼리 파라미터 (case, 존재)"
    ssac-statemachine: "SSaC @state diagram/transition ↔ stateDiagram 매칭"
    ssac-authz: "SSaC @auth 입력 필드 ↔ authz.CheckRequest struct"
    ddl-rego: "Rego @ownership ↔ DDL 테이블·컬럼·조인 존재"
    ddl-statemachine: "stateDiagram state → DDL 컬럼·DEFAULT 매핑"
    openapi-ssac: "OpenAPI operationId/response ↔ SSaC funcName/@response"
    openapi-manifest: "OpenAPI securitySchemes ↔ manifest backend.middleware"
    openapi-hurl: "Hurl path/method/status → OpenAPI 정의"
    rego-manifest: "Rego input.claims / role 리터럴 ↔ manifest claims / roles"
    tsx: "TSX 자체 정합성 (로컬 컴포넌트 import 존재 등) — T-*"
    tsx-openapi: "TSX apiClient 호출 ↔ OpenAPI operationId/params/body — XOT-*"
    preserve-safety: "preserved 파일 런타임 안전 가드 — panic, type assertion, unmarshal/Scan 에러, nil/slice/map, defer close (PRV-10~17)"
    # --- report emitters (pkg/report/*) ---
    json: "yongol bespoke flat JSON 리포트 에미터 — pkg/report/json"
    sarif: "SARIF 2.1.0 full-catalog 리포트 에미터 — pkg/report/sarif"
    md: "Markdown 리포트 출력 — cmd/yongol/print_report_md.go"
    format: "리포트 포맷 선택 (--format text/json/sarif/md) 통합 처리"
    # --- rule catalog (pkg/rule/catalog) ---
    catalog: "rulebook.md 파싱 + RuleMeta 카탈로그 로더 — pkg/rule/catalog"
    # --- gogin middleware / boot runtime topics ---
    csrf: "CSRF 보호 미들웨어 생성/등록 (Phase005) — pkg/generate/gogin/boot/*csrf*.go, middleware/*csrf*.go"
    request-id: "X-Request-ID 미들웨어 생성/등록 (Phase004) — pkg/generate/gogin/boot/*request_id*.go, middleware/*request_id*.go"
    security-headers: "SecurityHeaders 미들웨어 (CSP/HSTS 등) 생성/등록 — pkg/generate/gogin/boot/*security_headers*.go, middleware/*security_headers*.go"
    error-envelope: "ErrorEnvelope 미들웨어 (표준 에러 응답) 생성/등록 (Phase004) — pkg/generate/gogin/boot/*error_envelope*.go, middleware/*error_envelope*.go"
    dos-guard: "BodyLimit / MultipartLimit 등 DoS 방어 미들웨어 등록 — pkg/generate/gogin/boot/block_body_limit.go"
    path-convert: "OpenAPI 경로 템플릿 ↔ gin 라우트 변환 — pkg/generate/gogin/boot/openapi_path_to_gin.go"
    size-parse: "human-readable size(1MiB 등) → bytes 변환 — pkg/generate/gogin/middleware/parse_size.go"
    http-config: "manifest backend.http 섹션 (body_limit / multipart_limit / overrides) 파싱"
    # --- manifest security / auth rules ---
    manifest-auth: "manifest auth / csrf / JWT 정책 검증 (SEC-201/401/402/403)"
    manifest-security-headers: "manifest backend.security_headers 정책 검증 (SEC-301 CSP / SEC-302 HSTS)"
    # --- migration generator / validator topics ---
    migration-hints: "@rename / @backfill / @data_migration 힌트 파서 + MIG-001/003 규칙"
    migration-safety: "NOT NULL / DROP / CAST 등 파괴적 DDL 안전성 검사 (MIG-002/004/005)"
    migration-snapshot: ".generated_schema.sql 스냅샷 무결성 검증 (MIG-006)"
    # --- gogin infra / runtime adapter topics ---
    auth-refresh: "ssac/pkg/auth.RefreshStore adapter 생성 — pkg/generate/gogin/infra/wrap_auth.go"
    cache: "ssac/pkg/cache.CacheModel adapter 생성 — pkg/generate/gogin/infra/wrap_cache.go"
    queue: "ssac/pkg/queue.Backend adapter 생성 — pkg/generate/gogin/infra/wrap_queue.go"
    session: "ssac/pkg/session.SessionModel adapter 생성 — pkg/generate/gogin/infra/wrap_session.go"
    health: "/health / /ready 헬스체크 핸들러 — pkg/generate/gogin/boot/block_health*.go"
    authz: "인가 검사 (owner lookup, resource id) — pkg/generate/gogin/ssac/build_auth*.go"
    # --- hurl pair-check topics ---
    hurl-manifest: "Hurl ↔ manifest 교차 검증 (XOH-06/07: 인증 선조건, CSRF)"
    hurl-openapi: "Hurl ↔ OpenAPI 교차 검증 (XOH-01/02/03/04/08/09)"
    hurl-statemachine: "Hurl ↔ stateDiagram 교차 검증 (XOH-05 상태 전이 순서)"
    # --- manifest infra requires-sqlc topics ---
    manifest-infra: "manifest backend.{auth,cache,queue,session} 구성 시 sqlc/DDL 요구 검증 (XNA/XNC/XNQ/XNS-90)"
    # --- query ↔ rego pair topics ---
    query-rego: "sqlc 쿼리 ↔ Rego 정책 교차 검증 (XQP-30 owner lookup)"
    # --- pgtype mapping topics (Phase001) ---
    pgtype-matrix: "pkg/generate/gogin/types/ — DDL Column → GoTypeBinding 단일 출처 (17 PG family × 3 nullability × 4 emit). 3 emit 사이트 (convert/insert/response) 가 공유"
    pgtype-override: "Q-12/Q-13/Q-14/Q-15/Q-16/Q-17/Q-18 — sqlc.yaml 의 pgtype.UUID/Numeric/Timestamptz/Timestamp/Date/Inet/Interval override 누락 검사 (NeedsOverride=true 기반)"
    unsupported-pgtype: "D-11 — 매트릭스 미등재 다중 토큰 PG 타입 (TIME WITH/WITHOUT TIME ZONE, BIT VARYING) / CREATE TYPE 사용자 정의 ENUM 거절. DOUBLE PRECISION / TIMESTAMP WITH/WITHOUT TIME ZONE / CHARACTER VARYING 는 정규화 매트릭스 (ddl.NormalizePGTypeHead) 에서 단일 토큰 별칭으로 환산되어 정상 처리"
    multi-token-pg-type: "pkg/parser/ddl/extract_raw_type.go + multi_token_heads.go — parts[1:] 토큰을 다중 단어 PG 타입 매트릭스로 greedy match 하여 RawType 보존. pkg/parser/ddl/normalize_pg_head.go + pg_head_aliases.go — 다중 단어 head 를 단일 토큰 별칭 (FLOAT8/TIMESTAMPTZ/TIMESTAMP/VARCHAR/CHAR/TIMETZ/TIME/VARBIT) 으로 환산 (gen/types + validate/query 공유)"
    returning-shape: "XQS-20 — SSaC 선언 반환 타입 ↔ sqlc 쿼리 RETURNING 절 형태 (Model ↔ full RETURNING / `<QueryName>Row` ↔ partial RETURNING). pkg/validate/ssac_sqlc/xqs_20_return_type_match.go + extract/classify/expected/build_advice helpers"
