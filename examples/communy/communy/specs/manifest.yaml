apiVersion: yongol/v1
kind: Project
metadata:
  name: communy
  description: "DC Inside-style anonymous community"
backend:
  lang: go
  framework: gin
  module: github.com/park-jun-woo/communy
  middleware:
    - bearerAuth
  auth:
    type: jwt
    mode: bearer
    secret_env: JWT_SECRET
    user_table: users
    claims:
      ID: id:int64
      Email: email:string
      Role: role:string
    roles: [admin]
  rate_limit:
    Login:
      rpm: 10
      by: ip
  cors:
    allowed_origins:
      - "http://localhost:5173"
    allowed_methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed_headers:
      - Authorization
      - Content-Type
    allow_credentials: true
frontend:
  lang: typescript
  framework: react
  bundler: vite
  name: communy-web
