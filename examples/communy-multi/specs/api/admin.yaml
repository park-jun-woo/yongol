openapi: 3.0.3
info:
  title: Communy Admin API
  description: DC Inside-style anonymous community — admin moderation domain
  version: 0.1.0
servers:
  - url: http://localhost:8080/api/admin
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code: { type: string }
        details:
          type: object
          additionalProperties: true
    Report:
      type: object
      required: [id, gallery_id, target_type, target_id, reporter_id, reason, status]
      properties:
        id: { type: integer, format: int64 }
        gallery_id: { type: integer, format: int64 }
        target_type: { type: string }
        target_id: { type: integer, format: int64 }
        reporter_id: { type: integer, format: int64 }
        reason: { type: string }
        status: { type: string }

paths:
  /reports:
    get:
      operationId: ListReports
      summary: List all reports across galleries (moderation queue)
      responses:
        '200':
          description: Reports list
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Report' }
                  total: { type: integer, format: int64 }
        '403':
          description: Forbidden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /reports/{id}/resolve:
    post:
      operationId: ResolveReport
      summary: Resolve a report
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Resolved report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Invalid state transition
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Forbidden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /reports/{id}/dismiss:
    post:
      operationId: DismissReport
      summary: Dismiss a report
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Dismissed report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Invalid state transition
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Forbidden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
