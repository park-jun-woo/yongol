apiVersion: yongol/v1
kind: Project
metadata:
  name: [name]
  description: "[name] SSOT-based fullstack platform"
backend:
  lang: go
  framework: gin
  module: github.com/[author]/[name]
  middleware:
    - bearerAuth
  http:
    # Dev/default: server is directly exposed, so c.ClientIP() is the real
    # client. When deploying behind a proxy/CDN, set the proxy CIDRs here
    # (or override via BACKEND_HTTP_TRUSTED_PROXIES) so IP-keyed rate limits
    # see the true client address.
    trusted_proxies:
      - "127.0.0.1/32"
      - "::1/128"
  rate_limit:
    Login:
      rate: 5
      period: "1m"
      key: ip
    Signup:
      rate: 5
      period: "1m"
      key: ip
  auth:
    type: jwt
    mode: bearer
    secret_env: JWT_SECRET
    user_table: users
    claims:
      ID: id:int64
      Email: email:string
      Role: role:string
    roles:
      - admin
frontend:
  enabled: true
  lang: typescript
  framework: react
  bundler: vite
  name: [name]-web
  index: me
