version: "2"
sql:
  - schema: "."
    queries: queries/
    engine: postgresql
    gen:
      go:
        package: db
        out: ../../arts/backend/internal/db
        sql_package: pgx/v5
        emit_json_tags: true
        emit_interface: false
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            nullable: false
            go_type: "github.com/jackc/pgx/v5/pgtype.UUID"
          - db_type: uuid
            nullable: true
            go_type: "github.com/jackc/pgx/v5/pgtype.UUID"
          - db_type: timestamptz
            nullable: false
            go_type: "github.com/jackc/pgx/v5/pgtype.Timestamptz"
          - db_type: timestamptz
            nullable: true
            go_type: "github.com/jackc/pgx/v5/pgtype.Timestamptz"
