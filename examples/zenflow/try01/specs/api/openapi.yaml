      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: string
                required: [content]
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/execution-logs/{id}/detail:
    get:
      operationId: GetExecutionDetail
      summary: Get execution detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
