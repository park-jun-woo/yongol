      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  execution_logs:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExecutionLog'
                required: [execution_logs]
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Forbidden
          content:
            application/json:
