openapi: 3.0.3
info:
  title: ZenFlow Try01
  description: ZenFlow workflow automation demo — clean-room try01
  version: 0.1.0
servers:
  - url: http://localhost:8080
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code: { type: string }
        details:
          type: object
          additionalProperties: true
    User:
      type: object
      required: [id, email, role, created_at]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email, maxLength: 255 }
        role: { type: string, enum: [admin, member] }
        created_at: { type: string, format: date-time }
    Workflow:
      type: object
      required: [id, owner_id, title, trigger_event, status, created_at]
      properties:
        id:            { type: integer, format: int64 }
        owner_id:      { type: integer, format: int64 }
        title:         { type: string, maxLength: 255 }
        trigger_event: { type: string, maxLength: 64 }
        status:        { type: string, enum: [draft, active, paused, archived] }
        created_at:    { type: string, format: date-time }
paths:
  /auth/register:
    post:
      operationId: Register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:    { type: string, format: email, maxLength: 255, minLength: 3 }
                password: { type: string, minLength: 8, maxLength: 64 }
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '400': { description: bad request, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '409': { description: conflict, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '500': { description: server error, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /auth/login:
    post:
      operationId: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:    { type: string, format: email, maxLength: 255, minLength: 3 }
                password: { type: string, minLength: 8, maxLength: 64 }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [access_token]
                properties:
                  access_token: { type: string }
        '401': { description: unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '500': { description: server error, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /workflows:
    post:
      operationId: CreateWorkflow
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, trigger_event]
              properties:
                title:         { type: string, maxLength: 255, minLength: 1 }
                trigger_event: { type: string, maxLength: 64, minLength: 1 }
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                type: object
                required: [workflow]
                properties:
                  workflow: { $ref: '#/components/schemas/Workflow' }
        '401': { description: unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '403': { description: forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    get:
      operationId: ListWorkflows
      security:
        - bearerAuth: []
      parameters:
        - { name: page,     in: query, schema: { type: integer, default: 1, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Workflow' }
                  total: { type: integer, format: int64 }
        '401': { description: unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '403': { description: forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /workflows/{id}/activate:
    post:
      operationId: ActivateWorkflow
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [workflow]
                properties:
                  workflow: { $ref: '#/components/schemas/Workflow' }
        '401': { description: unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '403': { description: forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { description: not found, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '409': { description: conflict, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
