openapi: "3.0.3"
info:
  title: ZenFlow API
  version: "1.0.0"
servers:
  - url: http://localhost:8080

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
    Workflow:
      type: object
      required: [id, org_id, title, trigger_event, status, created_at, version, root_workflow_id]
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        title:
          type: string
        trigger_event:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
        root_workflow_id:
          type: string
          format: uuid
        assigned_to:
          type: string
          format: uuid
        assignment_confidence:
          type: string
    Action:
      type: object
      required: [id, workflow_id, action_type, config, sequence_order]
      properties:
        id:
          type: string
          format: uuid
        workflow_id:
          type: string
          format: uuid
        action_type:
          type: string
        config:
          type: string
        sequence_order:
          type: integer
          format: int64
    ActionInput:
      type: object
      required: [action_type, config, sequence_order]
      properties:
        action_type:
          type: string
        config:
          type: string
        sequence_order:
          type: integer
          format: int64
    AuditLog:
      type: object
      required: [id, org_id, actor_id, action, resource_type, resource_id, detail, created_at]
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
        action:
          type: string
        resource_type:
          type: string
        resource_id:
          type: string
        detail:
          type: string
        created_at:
          type: string
          format: date-time
    Organization:
      type: object
      required: [id, name, plan_type, credits_balance, address, latitude, longitude, address_verified]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        plan_type:
          type: string
        credits_balance:
          type: integer
          format: int64
        address:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        address_verified:
          type: boolean
    Template:
      type: object
      required: [id, source_workflow_id, org_id, title, description, category, clone_count, created_at]
      properties:
        id:
          type: string
          format: uuid
        source_workflow_id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        category:
          type: string
        clone_count:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
    Webhook:
      type: object
      required: [id, org_id, url, event_type, created_at]
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        url:
          type: string
        event_type:
          type: string
        created_at:
          type: string
          format: date-time
    SummarizeResponse:
      type: object
      required: [org_name, plan_type, credits_balance, active_workflows, paused_workflows, total_executions, total_credits_spent]
      properties:
        org_name:
          type: string
        plan_type:
          type: string
        credits_balance:
          type: integer
          format: int64
        active_workflows:
          type: integer
          format: int64
        paused_workflows:
          type: integer
          format: int64
        total_executions:
          type: integer
          format: int64
        total_credits_spent:
          type: integer
          format: int64
    BuildExecutionDetailResponse:
      type: object
      required: [id, workflow_id, workflow_title, org_id, org_name, status, credits_spent, executed_at]
      properties:
        id:
          type: string
        workflow_id:
          type: string
        workflow_title:
          type: string
        org_id:
          type: string
        org_name:
          type: string
        status:
          type: string
        credits_spent:
          type: integer
          format: int64
        executed_at:
          type: string
    ParseCronResponse:
      type: object
      required: [cron, next_run]
      properties:
        cron:
          type: string
        next_run:
          type: string
    DecodeValueResponse:
      type: object
      required: [value]
      properties:
        value:
          type: string
    ExecutionLog:
      type: object
      required: [id, workflow_id, org_id, status, credits_spent, executed_at]
      properties:
        id:
          type: string
          format: uuid
        workflow_id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        status:
          type: string
        credits_spent:
          type: integer
          format: int64
        executed_at:
          type: string
          format: date-time
        report_key:
          type: string

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      operationId: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                required: [access_token]
                properties:
                  access_token:
                    type: string
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workflows:
    post:
      operationId: CreateWorkflow
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, trigger_event]
              properties:
                title:
                  type: string
                trigger_event:
                  type: string
      responses:
        '201':
          description: Workflow created
          content:
            application/json:
              schema:
                type: object
                required: [workflow]
                properties:
                  workflow:
                    $ref: '#/components/schemas/Workflow'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: ListWorkflows
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of workflows
          content:
            application/json:
              schema:
                type: object
                required: [workflows]
                properties:
                  workflows:
                    type: array
                    items:
                      $ref: '#/components/schemas/Workflow'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workflows/{id}:
    get:
      operationId: GetWorkflow
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Workflow detail
          content:
            application/json:
              schema:
                type: object
                required: [workflow]
                properties:
                  workflow:
                    $ref: '#/components/schemas/Workflow'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workflows/{id}/actions:
    put:
      operationId: SaveWorkflowActions
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actions]
              properties:
                actions:
                  type: array
                  items:
                    $ref: '#/components/schemas/ActionInput'
      responses:
        '200':
          description: Actions saved
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: AddAction
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action_type, config, sequence_order]
              properties:
                action_type:
                  type: string
                config:
                  type: string
                sequence_order:
                  type: integer
                  format: int64
      responses:
        '201':
          description: Action added
          content:
            application/json:
              schema:
                type: object
                required: [action]
                properties:
                  action:
                    $ref: '#/components/schemas/Action'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workflows/{id}/activate:
    post:
      operationId: ActivateWorkflow
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Workflow activated
          content:
            application/json:
              schema:
                type: object
                required: [workflow]
                properties:
                  workflow:
                    $ref: '#/components/schemas/Workflow'
        '402':
          description: Payment required (insufficient credits)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Invalid state transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workflows/{id}/pause:
    post:
      operationId: PauseWorkflow
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Workflow paused
          content:
            application/json:
              schema:
                type: object
                required: [workflow]
                properties:
                  workflow:
                    $ref: '#/components/schemas/Workflow'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Invalid state transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workflows/{id}/archive:
    post:
      operationId: ArchiveWorkflow
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Workflow archived
          content:
            application/json:
              schema:
                type: object
                required: [workflow]
                properties:
                  workflow:
                    $ref: '#/components/schemas/Workflow'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Invalid state transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workflows/{id}/execute:
    post:
      operationId: ExecuteWorkflow
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Workflow executed
          content:
            application/json:
              schema:
                type: object
                required: [execution_log]
                properties:
                  execution_log:
                    $ref: '#/components/schemas/ExecutionLog'
        '402':
          description: Payment required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Invalid state transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workflows/{id}/execution-logs:
    get:
      operationId: ListExecutionLogs
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of execution logs
          content:
            application/json:
              schema:
                type: object
                required: [execution_logs]
                properties:
                  execution_logs:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExecutionLog'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workflows/{id}/new-version:
    post:
      operationId: CreateWorkflowVersion
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: New version created
          content:
            application/json:
              schema:
                type: object
                required: [workflow]
                properties:
                  workflow:
                    $ref: '#/components/schemas/Workflow'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workflows/{id}/versions:
    get:
      operationId: ListWorkflowVersions
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of workflow versions
          content:
            application/json:
              schema:
                type: object
                required: [workflows]
                properties:
                  workflows:
                    type: array
                    items:
                      $ref: '#/components/schemas/Workflow'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /webhooks:
    post:
      operationId: CreateWebhook
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, event_type]
              properties:
                url:
                  type: string
                event_type:
                  type: string
      responses:
        '201':
          description: Webhook created
          content:
            application/json:
              schema:
                type: object
                required: [webhook]
                properties:
                  webhook:
                    $ref: '#/components/schemas/Webhook'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: ListWebhooks
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of webhooks
          content:
            application/json:
              schema:
                type: object
                required: [webhooks]
                properties:
                  webhooks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Webhook'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /webhooks/{id}:
    delete:
      operationId: DeleteWebhook
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Webhook deleted
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /templates:
    post:
      operationId: PublishTemplate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workflow_id, title, description, category]
              properties:
                workflow_id:
                  type: string
                  format: uuid
                title:
                  type: string
                description:
                  type: string
                category:
                  type: string
      responses:
        '201':
          description: Template published
          content:
            application/json:
              schema:
                type: object
                required: [template]
                properties:
                  template:
                    $ref: '#/components/schemas/Template'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Workflow not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Already published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: ListTemplates
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: per_page
          in: query
          schema:
            type: integer
            format: int64
            default: 20
            maximum: 100
        - name: category
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Template list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Template'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /templates/{id}:
    get:
      operationId: GetTemplate
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Template detail
          content:
            application/json:
              schema:
                type: object
                required: [template]
                properties:
                  template:
                    $ref: '#/components/schemas/Template'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /templates/{id}/clone:
    post:
      operationId: CloneTemplate
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Workflow cloned from template
          content:
            application/json:
              schema:
                type: object
                required: [workflow]
                properties:
                  workflow:
                    $ref: '#/components/schemas/Workflow'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workflows/{id}/execute-with-report:
    post:
      operationId: ExecuteWithReport
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Workflow executed with report
          content:
            application/json:
              schema:
                type: object
                required: [execution_log]
                properties:
                  execution_log:
                    $ref: '#/components/schemas/ExecutionLog'
        '402':
          description: Payment required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Invalid state transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /execution-logs/{id}/report:
    get:
      operationId: GetExecutionReport
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Report file content
          content:
            application/json:
              schema:
                type: object
                required: [content]
                properties:
                  content:
                    type: string
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workflows/{id}/schedule:
    post:
      operationId: SetSchedule
