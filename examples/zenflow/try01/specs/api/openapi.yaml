      operationId: AutoAssignWorkflow
      summary: Auto-assign workflow users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflow:
                    $ref: '#/components/schemas/Workflow'
                required: [workflow]
        "401":
          description: Unauthorized
