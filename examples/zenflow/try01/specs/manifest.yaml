apiVersion: yongol/v1
kind: Project
metadata:
  name: zenflow
backend:
  lang: go
  framework: gin
  module: github.com/park-jun-woo/zenflow
  auth:
    type: jwt
    secret_env: JWT_SECRET
    user_table: users
    mode: bearer
    claims:
      ID: id:uuid
      Email: email:string
      Role: role:string
      OrgID: org_id:uuid
  cors:
    allowed_origins:
      - "http://localhost:5173"
      - "http://localhost:3000"
  http:
    body_limit: 10485760
  observability:
    metrics:
      enabled: true
    tracing:
      enabled: false
  error:
    envelope:
      enabled: true
    request_id:
      enabled: true
  security_headers:
    enabled: true
  middleware:
    - bearerAuth
frontend:
  lang: typescript
  framework: react
  bundler: vite
  name: zenflow-ui
