apiVersion: yongol/v1
kind: Project
metadata:
  name: zenflow-try01
backend:
  lang: go
  framework: gin
  module: github.com/park-jun-woo/zenflow-try01
  middleware:
    - bearerAuth
  auth:
    type: jwt
    mode: bearer
    secret_env: JWT_SECRET
    user_table: users
    roles:
      - admin
      - member
    claims:
      ID: id:int64
      Email: email:string
      Role: role:string
      OrgID: org_id:int64
frontend:
  lang: typescript
  framework: react
  bundler: vite
  name: zenflow-web
  design: frontend/DESIGN.md
