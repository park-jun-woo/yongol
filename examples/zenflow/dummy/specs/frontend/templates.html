<main>
  <section data-fetch="ListTemplates">
    <h2>Templates</h2>
    <ul data-each="items">
      <li>
        <span data-bind="title"></span>
        <span data-bind="category"></span>
        <span data-bind="clone_count"></span>
      </li>
    </ul>
  </section>

  <article data-fetch="GetTemplate" data-param-id="route.id">
    <h3 data-bind="template.title"></h3>
    <p data-bind="template.description"></p>
    <p data-bind="template.category"></p>
  </article>

  <div data-action="PublishTemplate">
    <h3>Publish Template</h3>
    <input data-field="source_workflow_id" type="number" placeholder="Source Workflow ID" />
    <input data-field="title" type="text" placeholder="Title" />
    <input data-field="description" type="text" placeholder="Description" />
    <input data-field="category" type="text" placeholder="Category" />
    <button type="submit">Publish</button>
  </div>

  <div data-action="CloneTemplate" data-param-id="route.id">
    <button type="submit">Clone Template</button>
  </div>
</main>
