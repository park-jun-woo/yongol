<main>
  <article data-fetch="GetSchedule" data-param-id="route.id">
    <span data-bind="cron"></span>
    <span data-bind="next_fire"></span>
  </article>

  <div data-action="SetSchedule" data-param-id="route.id">
    <input data-field="cron" type="text" />
    <button type="submit">Set Schedule</button>
  </div>

  <button data-action="DeleteSchedule" data-param-id="route.id">Delete Schedule</button>
</main>
