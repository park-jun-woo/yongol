<main>
  <div data-action="CreateOrganization">
    <input data-field="name" type="text" />
    <input data-field="plan_type" type="text" />
    <input data-field="credits_balance" type="number" />
    <button type="submit">Create Organization</button>
  </div>

  <div data-action="VerifyOrgAddress" data-param-id="route.id">
    <input data-field="address" type="text" />
    <button type="submit">Verify Address</button>
  </div>
</main>
