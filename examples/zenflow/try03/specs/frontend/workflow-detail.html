<main>
  <article data-fetch="GetWorkflow" data-param-id="route.id">
    <h1 data-bind="workflow.title"></h1>
    <span data-bind="workflow.status"></span>
    <span data-bind="workflow.trigger_event"></span>

    <div data-action="ActivateWorkflow" data-param-id="route.id">
      <button type="submit">Activate</button>
    </div>

    <div data-action="PauseWorkflow" data-param-id="route.id">
      <button type="submit">Pause</button>
    </div>

    <div data-action="ArchiveWorkflow" data-param-id="route.id">
      <button type="submit">Archive</button>
    </div>

    <div data-action="ExecuteWorkflow" data-param-id="route.id">
      <button type="submit">Execute</button>
    </div>

    <div data-action="CreateWorkflowVersion" data-param-id="route.id">
      <button type="submit">New Version</button>
    </div>
  </article>

  <section data-fetch="ListWorkflowVersions" data-param-id="route.id">
    <ul data-each="workflows">
      <li>
        <span data-bind="title"></span>
        <span data-bind="version"></span>
        <span data-bind="status"></span>
      </li>
    </ul>
  </section>

  <section data-fetch="ListActions" data-param-id="route.id">
    <ul data-each="actions">
      <li>
        <span data-bind="action_type"></span>
        <span data-bind="sequence_order"></span>
      </li>
    </ul>
  </section>

  <div data-action="CreateAction" data-param-id="route.id">
    <input data-field="action_type" type="text" />
    <input data-field="config" type="text" />
    <input data-field="sequence_order" type="number" />
    <button type="submit">Add Action</button>
  </div>

  <div data-action="SaveWorkflowActions" data-param-id="route.id">
    <input data-field="items" type="text" />
    <button type="submit">Batch Save Actions</button>
  </div>

  <button data-action="AutoAssignWorkflow" data-param-id="route.id">Auto Assign</button>

  <section data-fetch="ListExecutionLogs" data-param-id="route.id">
    <ul data-each="execution_logs">
      <li>
        <span data-bind="status"></span>
        <span data-bind="credits_spent"></span>
        <span data-bind="executed_at"></span>
      </li>
    </ul>
  </section>
</main>
