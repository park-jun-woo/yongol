<main>
  <section data-fetch="ListTemplates">
    <ul data-each="items">
      <li>
        <span data-bind="title"></span>
        <span data-bind="category"></span>
        <span data-bind="clone_count"></span>
      </li>
    </ul>
  </section>

  <article data-fetch="GetTemplate" data-param-id="route.id">
    <span data-bind="template.title"></span>
    <span data-bind="template.description"></span>
    <span data-bind="template.category"></span>
    <button data-action="CloneTemplate" data-param-id="route.id">Clone</button>
  </article>

  <div data-action="PublishTemplate">
    <input data-field="workflow_id" type="text" />
    <input data-field="description" type="text" />
    <input data-field="category" type="text" />
    <button type="submit">Publish</button>
  </div>
</main>
