openapi: 3.0.3
info:
  title: ZenFlow
  description: ZenFlow workflow automation SaaS (try03 clean-room)
  version: 0.1.0
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code: { type: string }
        details:
          type: object
          additionalProperties: true

    Organization:
      type: object
      required: [id, name, plan_type, credits_balance, created_at]
      properties:
        id:              { type: integer, format: int64 }
        name:            { type: string }
        plan_type:       { type: string }
        credits_balance: { type: integer, format: int64 }
        created_at:      { type: string, format: date-time }

    User:
      type: object
      required: [id, org_id, email, role, created_at]
      properties:
        id:         { type: integer, format: int64 }
        org_id:     { type: integer, format: int64 }
        email:      { type: string }
        role:       { type: string }
        created_at: { type: string, format: date-time }

    Workflow:
      type: object
      required: [id, org_id, title, trigger_event, status, created_at]
      properties:
        id:            { type: integer, format: int64 }
        org_id:        { type: integer, format: int64 }
        title:         { type: string }
        trigger_event: { type: string }
        status:        { type: string }
        created_at:    { type: string, format: date-time }

    ExecutionLog:
      type: object
      required: [id, workflow_id, org_id, status, credits_spent, executed_at]
      properties:
        id:            { type: integer, format: int64 }
        workflow_id:   { type: integer, format: int64 }
        org_id:        { type: integer, format: int64 }
        status:        { type: string }
        credits_spent: { type: integer, format: int64 }
        executed_at:   { type: string, format: date-time }

paths:
  /auth/register:
    post:
      operationId: Register
      summary: Register a new user and organization
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, org_name]
              properties:
                email:    { type: string, format: email, maxLength: 255 }
                password: { type: string, minLength: 8, maxLength: 255 }
                org_name: { type: string, maxLength: 255 }
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '409':
          description: Email already registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/login:
    post:
      operationId: Login
      summary: Login and obtain access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:    { type: string, format: email, maxLength: 255 }
                password: { type: string, minLength: 8, maxLength: 255 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [access_token]
                properties:
                  access_token: { type: string }
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /workflows:
    get:
      operationId: ListWorkflows
      summary: List workflows in my organization
      parameters:
        - { name: page,     in: query, schema: { type: integer, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: sort_by,  in: query, schema: { type: string, enum: [created_at] } }
        - { name: sort_dir, in: query, schema: { type: string, enum: [asc, desc] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Workflow' }
                  total: { type: integer, format: int64 }
        '403':
          description: Forbidden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      operationId: CreateWorkflow
      summary: Create a workflow in draft state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, trigger_event]
              properties:
                title:         { type: string, maxLength: 255 }
                trigger_event: { type: string, maxLength: 255 }
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [workflow]
                properties:
                  workflow: { $ref: '#/components/schemas/Workflow' }
        '403':
          description: Forbidden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /workflows/{id}:
    get:
      operationId: GetWorkflow
      summary: Get a workflow
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [workflow]
                properties:
                  workflow: { $ref: '#/components/schemas/Workflow' }
        '403':
          description: Forbidden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Not Found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /workflows/{id}/activate:
    post:
      operationId: ActivateWorkflow
      summary: Activate a workflow (requires credits_balance > 0)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [workflow]
                properties:
                  workflow: { $ref: '#/components/schemas/Workflow' }
        '402':
          description: Payment Required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Forbidden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Not Found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Invalid state transition
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /workflows/{id}/execute:
    post:
      operationId: ExecuteWorkflow
      summary: Execute a workflow (deducts 1 credit)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [log]
                properties:
                  log: { $ref: '#/components/schemas/ExecutionLog' }
        '402':
          description: Payment Required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Forbidden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Not Found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Invalid state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
