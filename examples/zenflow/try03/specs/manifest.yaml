apiVersion: yongol/v1
kind: Project
metadata:
  name: zenflow
backend:
  lang: go
  framework: gin
  module: github.com/park-jun-woo/zenflow
  middleware:
    - bearerAuth
  auth:
    type: jwt
    mode: bearer
    secret_env: JWT_SECRET
    user_table: users
    roles: [admin]
    claims:
      ID: id:uuid
      Email: email:string
      Role: role:string
      OrgID: org_id:uuid
queue:
  backend: postgres
file:
  backend: local
session:
  backend: postgres
cache:
  backend: postgres
frontend:
  lang: typescript
  framework: react
  bundler: vite
  name: zenflow-web
