openapi: "3.0.3"
info:
  title: Geocoding
  version: "1.0.0"
servers:
  - url: https://api.geocoding.example.com
paths:
  /geocode:
    post:
      operationId: geocode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                address:
                  type: string
      responses:
        "200":
          description: Geocode result
          content:
            application/json:
              schema:
                type: object
                properties:
                  latitude:
                    type: number
                    format: float
                  longitude:
                    type: number
                    format: float
                  formatted_address:
                    type: string
