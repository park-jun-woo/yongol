openapi: "3.1.0"
info:
  title: ZenFlow API
  version: "1.0.0"
  description: Multi-tenant workflow automation SaaS API

servers:
  - url: http://localhost:8080

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
      required:
        - error
        - code

    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        plan_type:
          type: string
          enum: [free, pro, enterprise]
        credits_balance:
          type: integer
          format: int64

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, member]

    Workflow:
      type: object
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        title:
          type: string
        trigger_event:
          type: string
        status:
          type: string
          enum: [draft, active, paused, archived]
        version:
          type: integer
          format: int64
        root_workflow_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time

    Action:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workflow_id:
          type: string
          format: uuid
        action_type:
          type: string
        config:
          type: string
        sequence_order:
          type: integer
          format: int64

    ExecutionLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workflow_id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        status:
          type: string
        credits_spent:
          type: integer
          format: int64
        executed_at:
          type: string
          format: date-time
        report_key:
          type: string

    Webhook:
      type: object
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        url:
          type: string
        event_type:
          type: string
        created_at:
          type: string
          format: date-time

    Template:
      type: object
      properties:
        id:
          type: string
          format: uuid
        source_workflow_id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        category:
          type: string
        clone_count:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time

    WorkflowSchedule:
      type: object
      properties:
        expression:
          type: string
        next_run:
          type: string

    AuditLog:
      type: object
      properties:
        id:
          type: integer
          format: int64
        org_id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
        action:
          type: string
        resource_type:
          type: string
        resource_id:
          type: integer
          format: int64
        detail:
          type: string
        created_at:
          type: string
          format: date-time

    SummarizeResponse:
      type: object
      properties:
        org_name:
          type: string
        plan_type:
          type: string
        credits_balance:
          type: integer
          format: int64
        active_workflows:
          type: integer
          format: int64
        paused_workflows:
          type: integer
          format: int64
        total_executions:
          type: integer
          format: int64
        total_credits_spent:
          type: integer
          format: int64

    BuildExecutionDetailResponse:
      type: object
      properties:
        id:
          type: string
        workflow_id:
          type: string
        workflow_title:
          type: string
        org_id:
          type: string
        org_name:
          type: string
        status:
          type: string
        credits_spent:
          type: integer
          format: int64
        executed_at:
          type: string

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      operationId: Login
      summary: User login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /workflows:
    post:
      operationId: CreateWorkflow
      summary: Create a new workflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, trigger_event]
              properties:
                title:
                  type: string
                trigger_event:
                  type: string
      responses:
        "201":
          description: Workflow created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: ListWorkflows
      summary: List workflows for current org
      responses:
        "200":
          description: Workflow list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Workflow"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /workflows/{id}:
    get:
      operationId: GetWorkflow
      summary: Get a workflow by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Workflow detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /workflows/{id}/actions:
    post:
      operationId: AddAction
      summary: Add an action to a workflow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action_type, config, sequence_order]
              properties:
                action_type:
                  type: string
                config:
                  type: string
                sequence_order:
                  type: integer
                  format: int64
      responses:
        "201":
          description: Action added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Action"
        "404":
          description: Workflow not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Invalid state for adding action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /workflows/{id}/activate:
    post:
      operationId: ActivateWorkflow
      summary: Activate a workflow (requires credits)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Workflow activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "402":
          description: Insufficient credits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Workflow not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Invalid state transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /workflows/{id}/pause:
    post:
      operationId: PauseWorkflow
      summary: Pause an active workflow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Workflow paused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Invalid state transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /workflows/{id}/archive:
    post:
      operationId: ArchiveWorkflow
      summary: Archive an active workflow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Workflow archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Invalid state transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /workflows/{id}/execute:
    post:
      operationId: ExecuteWorkflow
      summary: Execute a workflow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Execution result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionLog"
        "404":
          description: Workflow not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Workflow not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /workflows/{id}/execute-with-report:
    post:
      operationId: ExecuteWithReport
      summary: Execute a workflow and generate a report file
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Execution result with report key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionLog"
        "404":
          description: Workflow not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Workflow not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /workflows/{id}/new-version:
    post:
      operationId: CreateWorkflowVersion
      summary: Clone a workflow into a new draft version
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: New workflow version created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "404":
          description: Workflow not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /workflows/{id}/versions:
    get:
      operationId: ListWorkflowVersions
      summary: List all versions of a workflow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Workflow versions list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Workflow"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /workflows/{id}/logs:
    get:
      operationId: ListExecutionLogs
      summary: List execution logs for a workflow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Execution logs
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ExecutionLog"
        "404":
          description: Workflow not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /execution-logs/{id}/report:
    get:
      operationId: GetExecutionReport
      summary: Download the report file linked to an execution log
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Report file content
          content:
            application/json:
              schema:
                type: object
                properties:
                  body:
                    type: string
        "404":
          description: Execution log not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /webhooks:
    post:
      operationId: CreateWebhook
      summary: Register a webhook URL for the org
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, event_type]
              properties:
                url:
                  type: string
                event_type:
                  type: string
      responses:
        "201":
          description: Webhook registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: ListWebhooks
      summary: List webhooks for the current org
      responses:
        "200":
          description: Webhook list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Webhook"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /webhooks/{id}:
    delete:
      operationId: DeleteWebhook
      summary: Delete a webhook
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Webhook deleted
        "404":
          description: Webhook not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /templates:
    post:
      operationId: PublishTemplate
      summary: Publish a workflow as a public template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workflow_id, title, description, category]
              properties:
                workflow_id:
                  type: string
                  format: uuid
                title:
                  type: string
                description:
                  type: string
                category:
                  type: string
      responses:
        "201":
          description: Template published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "404":
          description: Workflow not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Already published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: ListTemplates
      summary: Cursor-paginated search of templates
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: per_page
          in: query
          schema:
            type: integer
            format: int64
            default: 20
            maximum: 100
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Template list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Template"
                required:
                  - items
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /templates/{id}:
    get:
      operationId: GetTemplate
      summary: Get a template by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Template detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /templates/{id}/clone:
    post:
      operationId: CloneTemplate
      summary: Clone a template into caller's org as a new workflow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Cloned workflow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "404":
          description: Template not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /workflows/{id}/schedule:
    post:
      operationId: SetSchedule
      summary: Register a cron schedule for a workflow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cron]
              properties:
                cron:
                  type: string
      responses:
        "200":
          description: Schedule registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowSchedule"
        "400":
          description: Invalid cron expression
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Workflow not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: GetSchedule
      summary: Read current schedule for a workflow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowSchedule"
        "404":
          description: Workflow not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: DeleteSchedule
      summary: Clear the schedule for a workflow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Schedule deleted
        "404":
          description: Workflow not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /audit-logs:
    get:
      operationId: ListAuditLogs
      summary: List audit logs for current org with offset pagination and sort
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            format: int64
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            format: int64
            default: 20
            maximum: 100
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [created_at, action]
            default: created_at
        - name: sort_dir
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: action
          in: query
          schema:
            type: string
        - name: actor_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Audit log list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditLog"
                  total:
                    type: integer
                    format: int64
                required:
                  - items
                  - total
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /audit-logs/recent:
    get:
      operationId: GetRecentAuditLogs
      summary: Get recent audit log entries from cache for dashboard
      responses:
        "200":
          description: Recent audit log entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
