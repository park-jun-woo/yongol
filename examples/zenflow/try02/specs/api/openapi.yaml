openapi: 3.0.3
info:
  title: zenflow
  description: ZenFlow workflow automation SaaS
  version: 0.1.0
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code: { type: string }
        details:
          type: object
          additionalProperties: true
    Workflow:
      type: object
      required: [id, org_id, title, trigger_event, status, created_at]
      properties:
        id: { type: integer, format: int64 }
        org_id: { type: integer, format: int64 }
        title: { type: string }
        trigger_event: { type: string }
        status:
          type: string
          enum: [draft, active, paused, archived]
        created_at: { type: string, format: date-time }
    Action:
      type: object
      required: [id, workflow_id, action_type, payload_template, sequence_order]
      properties:
        id: { type: integer, format: int64 }
        workflow_id: { type: integer, format: int64 }
        action_type: { type: string }
        payload_template:
          type: object
          additionalProperties: true
        sequence_order: { type: integer, format: int64 }
    ExecutionLog:
      type: object
      required: [id, workflow_id, org_id, status, credits_spent, executed_at]
      properties:
        id: { type: integer, format: int64 }
        workflow_id: { type: integer, format: int64 }
        org_id: { type: integer, format: int64 }
        status: { type: string }
        credits_spent: { type: integer, format: int64 }
        executed_at: { type: string, format: date-time }
paths:
  /auth/login:
    post:
      operationId: Login
      summary: Login with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 8 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [access_token]
                properties:
                  access_token: { type: string }
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /workflows:
    get:
      operationId: ListWorkflows
      summary: List workflows in the current organization
      parameters:
        - name: page
          in: query
          schema: { type: integer, format: int64, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, format: int64, default: 20, maximum: 100 }
        - name: sort_by
          in: query
          schema: { type: string, enum: [created_at] }
        - name: sort_dir
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Workflow' }
                  total: { type: integer, format: int64 }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Forbidden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      operationId: CreateWorkflow
      summary: Create a workflow (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, trigger_event]
              properties:
                title: { type: string }
                trigger_event: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [workflow]
                properties:
                  workflow: { $ref: '#/components/schemas/Workflow' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Forbidden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /workflows/{id}/activate:
    post:
      operationId: ActivateWorkflow
      summary: Activate a workflow (admin only, requires credits)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [workflow]
                properties:
                  workflow: { $ref: '#/components/schemas/Workflow' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '402':
          description: Insufficient credits
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Forbidden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Workflow not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Cannot activate workflow in its current state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /workflows/{id}/execute:
    post:
      operationId: ExecuteWorkflow
      summary: Execute a workflow's actions and deduct credits
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [log, steps]
                properties:
                  log: { $ref: '#/components/schemas/ExecutionLog' }
                  steps:
                    type: array
                    items: { $ref: '#/components/schemas/Action' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '402':
          description: Insufficient credits
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Forbidden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Workflow not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Workflow is not active
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
