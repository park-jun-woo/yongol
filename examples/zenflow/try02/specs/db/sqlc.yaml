version: "2"
sql:
  - engine: postgresql
    schema: "."
    queries: "queries/*.sql"
    gen:
      go:
        package: db
        out: "../../arts/backend/internal/db"
        sql_package: pgx/v5
        overrides:
          - db_type: "uuid"
            nullable: false
            go_type:
              import: "github.com/jackc/pgx/v5/pgtype"
              package: "pgtype"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/jackc/pgx/v5/pgtype"
              package: "pgtype"
              type: "UUID"
          - db_type: "timestamp"
            nullable: false
            go_type:
              import: "github.com/jackc/pgx/v5/pgtype"
              package: "pgtype"
              type: "Timestamp"
          - db_type: "timestamp"
            nullable: true
            go_type:
              import: "github.com/jackc/pgx/v5/pgtype"
              package: "pgtype"
              type: "Timestamp"
          - db_type: "timestamptz"
            nullable: false
            go_type:
              import: "github.com/jackc/pgx/v5/pgtype"
              package: "pgtype"
              type: "Timestamptz"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "github.com/jackc/pgx/v5/pgtype"
              package: "pgtype"
              type: "Timestamptz"
