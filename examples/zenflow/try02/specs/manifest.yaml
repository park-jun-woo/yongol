apiVersion: yongol/v1
kind: Project
metadata:
  name: zenflow
backend:
  lang: go
  framework: gin
  module: github.com/park-jun-woo/zenflow
  auth:
    type: jwt
    secret_env: JWT_SECRET
    user_table: users
    mode: bearer
    claims:
      ID: id:uuid
      Email: email:string
      Role: role:string
      OrgID: org_id:uuid
  middleware:
    - bearerAuth
cache:
  backend: postgres
queue:
  backend: postgres
session:
  backend: postgres
file:
  backend: local
frontend:
  lang: typescript
  framework: react
  bundler: vite
  name: zenflow-app
