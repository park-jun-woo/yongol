<main>
  <section data-fetch="ListWebhooks">
    <ul data-each="items">
      <li>
        <span data-bind="url"></span>
        <span data-bind="event_type"></span>
      </li>
    </ul>
  </section>

  <div data-action="CreateWebhook">
    <input data-field="url" type="text" placeholder="Webhook URL" />
    <input data-field="event_type" type="text" placeholder="Event type" />
    <button type="submit">Register Webhook</button>
  </div>

  <div data-action="DeleteWebhook" data-param-id="route.id">
    <button type="submit">Delete Webhook</button>
  </div>
</main>
