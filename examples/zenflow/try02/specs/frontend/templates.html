<main>
  <section data-fetch="ListTemplates">
    <ul data-each="items">
      <li>
        <span data-bind="title"></span>
        <span data-bind="category"></span>
        <span data-bind="clone_count"></span>
      </li>
    </ul>
  </section>

  <div data-action="PublishTemplate">
    <input data-field="workflow_id" type="text" placeholder="Workflow ID" />
    <input data-field="title" type="text" placeholder="Template title" />
    <input data-field="description" type="text" placeholder="Description" />
    <input data-field="category" type="text" placeholder="Category" />
    <button type="submit">Publish Template</button>
  </div>
</main>
