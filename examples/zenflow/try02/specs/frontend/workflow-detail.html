<main>
  <article data-fetch="GetWorkflow" data-param-id="route.id">
    <span data-bind="title"></span>
    <span data-bind="status"></span>
    <span data-bind="trigger_event"></span>

    <footer data-state="status=draft">
      <div data-action="ActivateWorkflow" data-param-id="route.id">
        <button type="submit">Activate</button>
      </div>
      <div data-action="AddAction" data-param-id="route.id">
        <input data-field="action_type" type="text" placeholder="Action type" />
        <input data-field="config" type="text" placeholder="Config" />
        <input data-field="sequence_order" type="number" placeholder="Order" />
        <button type="submit">Add Action</button>
      </div>
    </footer>

    <footer data-state="status=active">
      <div data-action="ExecuteWorkflow" data-param-id="route.id">
        <button type="submit">Execute</button>
      </div>
      <div data-action="ExecuteWithReport" data-param-id="route.id">
        <button type="submit">Execute with Report</button>
      </div>
      <div data-action="PauseWorkflow" data-param-id="route.id">
        <button type="submit">Pause</button>
      </div>
      <div data-action="ArchiveWorkflow" data-param-id="route.id">
        <button type="submit">Archive</button>
      </div>
    </footer>

    <footer data-state="status=paused">
      <div data-action="ActivateWorkflow" data-param-id="route.id">
        <button type="submit">Resume</button>
      </div>
    </footer>
  </article>

  <section data-fetch="ListExecutionLogs" data-param-id="route.id">
    <ul data-each="items">
      <li>
        <span data-bind="status"></span>
        <span data-bind="credits_spent"></span>
        <span data-bind="executed_at"></span>
      </li>
    </ul>
  </section>

  <div data-action="CreateWorkflowVersion" data-param-id="route.id">
    <button type="submit">Create New Version</button>
  </div>

  <section data-fetch="ListWorkflowVersions" data-param-id="route.id">
    <ul data-each="items">
      <li>
        <span data-bind="version"></span>
        <span data-bind="status"></span>
        <span data-bind="created_at"></span>
      </li>
    </ul>
  </section>
</main>
