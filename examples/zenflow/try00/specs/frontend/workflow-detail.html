<main>
  <article data-fetch="GetWorkflow" data-param-id="route.id">
    <h2 data-bind="workflow.title"></h2>
    <p data-bind="workflow.status"></p>
    <p data-bind="workflow.trigger_event"></p>

    <footer data-state="workflow.status=draft">
      <button data-action="ActivateWorkflow" data-param-id="route.id">Activate</button>
    </footer>

    <footer data-state="workflow.status=active">
      <button data-action="PauseWorkflow" data-param-id="route.id">Pause</button>
      <button data-action="ArchiveWorkflow" data-param-id="route.id">Archive</button>
      <button data-action="ExecuteWorkflow" data-param-id="route.id">Execute</button>
    </footer>

    <footer data-state="workflow.status=paused">
      <button data-action="ActivateWorkflow" data-param-id="route.id">Resume</button>
    </footer>
  </article>

  <section data-fetch="ListActions" data-param-id="route.id">
    <h3>Actions</h3>
    <ul data-each="actions">
      <li>
        <span data-bind="action_type"></span>
        <span data-bind="sequence_order"></span>
      </li>
    </ul>
  </section>

  <div data-action="CreateAction" data-param-id="route.id">
    <h3>Add Action</h3>
    <input data-field="action_type" type="text" placeholder="Action Type" />
    <input data-field="config" type="text" placeholder="Config" />
    <input data-field="sequence_order" type="number" placeholder="Order" />
    <button type="submit">Add</button>
  </div>

  <section data-fetch="ListExecutionLogs" data-param-id="route.id">
    <h3>Execution Logs</h3>
    <ul data-each="execution_logs">
      <li>
        <span data-bind="status"></span>
        <span data-bind="credits_spent"></span>
        <span data-bind="executed_at"></span>
      </li>
    </ul>
  </section>
</main>
