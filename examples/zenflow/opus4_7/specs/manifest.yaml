apiVersion: yongol/v1
kind: Project
metadata:
  name: zenflow
  description: "Multi-tenant workflow-automation SaaS"
backend:
  lang: go
  framework: gin
  module: github.com/park-jun-woo/zenflow
  middleware:
    - bearerAuth
  auth:
    type: jwt
    mode: bearer
    secret_env: JWT_SECRET
    user_table: users
    claims:
      ID: id:int64
      Email: email:string
      Role: role:string
      OrgID: org_id:int64
    roles:
      - admin
      - member
  rate_limit:
    Login:
      rate: 5
      period: "1m"
      key: ip
queue:
  backend: postgres
session:
  backend: postgres
frontend:
  enabled: false                  # STML 미작성 — 백엔드 전용 예제 (XMO-11)
  lang: typescript
  framework: react
  bundler: vite
  name: zenflow-web
