apiVersion: yongol/v1
kind: Project
metadata:
  name: opus4_7
  description: "ZenFlow multi-tenant workflow automation SaaS"
backend:
  lang: go
  framework: gin
  module: github.com/park-jun-woo/opus4_7
  middleware:
    - bearerAuth
  auth:
    type: jwt
    mode: bearer
    secret_env: JWT_SECRET
    user_table: users
    claims:
      ID: id:uuid
      Email: email:string
      Role: role:string
      OrgID: org_id:uuid
    roles:
      - admin
      - member
frontend:
  lang: typescript
  framework: react
  bundler: vite
  name: opus4_7-web
