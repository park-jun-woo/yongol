openapi: 3.0.3
info:
  title: ZenFlow API
  version: 0.1.0
servers:
  - url: http://localhost:8080

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Organization:
      type: object
      required: [id, name, plan_type, credits_balance, created_at]
      properties:
        id:           { type: integer, format: int64 }
        name:         { type: string }
        plan_type:    { type: string, enum: [free, pro, enterprise] }
        credits_balance: { type: integer, format: int64 }
        created_at:   { type: string, format: date-time }
    User:
      type: object
      required: [id, org_id, email, role, created_at]
      properties:
        id:           { type: integer, format: int64 }
        org_id:       { type: integer, format: int64 }
        email:        { type: string, format: email }
        role:         { type: string, enum: [admin, member] }
        created_at:   { type: string, format: date-time }
    Workflow:
      type: object
      required: [id, org_id, title, trigger_event, status, created_at]
      properties:
        id:            { type: integer, format: int64 }
        org_id:        { type: integer, format: int64 }
        title:         { type: string }
        trigger_event: { type: string }
        status:        { type: string, enum: [draft, active, paused, archived] }
        created_at:    { type: string, format: date-time }
    Action:
      type: object
      required: [id, workflow_id, action_type, payload_template, sequence_order, created_at]
      properties:
        id:               { type: integer, format: int64 }
        workflow_id:      { type: integer, format: int64 }
        action_type:      { type: string }
        payload_template: { type: object, additionalProperties: true }
        sequence_order:   { type: integer, format: int64 }
        created_at:       { type: string, format: date-time }
    ExecutionLog:
      type: object
      required: [id, workflow_id, org_id, status, credits_spent, executed_at]
      properties:
        id:            { type: integer, format: int64 }
        workflow_id:   { type: integer, format: int64 }
        org_id:        { type: integer, format: int64 }
        status:        { type: string }
        credits_spent: { type: integer, format: int64 }
        executed_at:   { type: string, format: date-time }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, description: "Human-readable neutral message" }
        code:  { type: string, description: "Machine-readable error code" }
    RegisterRequest:
      type: object
      required: [org_name, email, password]
      properties:
        org_name: { type: string }
        email:    { type: string, format: email }
        password: { type: string, minLength: 8 }
    RegisterResponse:
      type: object
      required: [user, organization, access_token]
      properties:
        user:         { $ref: '#/components/schemas/User' }
        organization: { $ref: '#/components/schemas/Organization' }
        access_token: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:    { type: string, format: email }
        password: { type: string, minLength: 8 }
    LoginResponse:
      type: object
      required: [access_token]
      properties:
        access_token: { type: string }
    CreateWorkflowRequest:
      type: object
      required: [title, trigger_event]
      properties:
        title:         { type: string }
        trigger_event: { type: string }
    ListWorkflowsResponse:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Workflow' } }
        total: { type: integer, format: int64 }
    AddActionRequest:
      type: object
      required: [action_type, payload_template, sequence_order]
      properties:
        action_type:      { type: string }
        payload_template: { type: object, additionalProperties: true }
        sequence_order:   { type: integer, format: int64, minimum: 0 }
    ExecuteWorkflowResponse:
      type: object
      required: [log]
      properties:
        log: { $ref: '#/components/schemas/ExecutionLog' }

security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      operationId: Register
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RegisterRequest' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterResponse' } } } }
        '400': { description: Bad Request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Email already registered, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '500': { description: Internal Server Error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /auth/login:
    post:
      operationId: Login
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/LoginResponse' } } } }
        '400': { description: Bad Request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Invalid credentials, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '500': { description: Internal Server Error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /workflows:
    post:
      operationId: CreateWorkflow
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateWorkflowRequest' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Workflow' } } } }
        '400': { description: Bad Request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    get:
      operationId: ListWorkflows
      parameters:
        - { name: page,     in: query, schema: { type: integer, default: 1,  minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
        - { name: sort_by,  in: query, schema: { type: string,  enum: [created_at, title], default: created_at } }
        - { name: sort_dir, in: query, schema: { type: string,  enum: [asc, desc], default: desc } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ListWorkflowsResponse' } } } }
        '403': { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /workflows/{id}:
    get:
      operationId: GetWorkflow
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Workflow' } } } }
        '403': { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Not Found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /workflows/{id}/actions:
    post:
      operationId: AddAction
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AddActionRequest' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Action' } } } }
        '400': { description: Bad Request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Not Found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /workflows/{id}/activate:
    post:
      operationId: ActivateWorkflow
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Workflow' } } } }
        '402': { description: Payment Required — insufficient credits, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Not Found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Invalid state transition, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /workflows/{id}/pause:
    post:
      operationId: PauseWorkflow
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Workflow' } } } }
        '403': { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Not Found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Invalid state transition, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /workflows/{id}/archive:
    post:
      operationId: ArchiveWorkflow
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Workflow' } } } }
        '403': { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Not Found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Invalid state transition, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /workflows/{id}/execute:
    post:
      operationId: ExecuteWorkflow
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ExecuteWorkflowResponse' } } } }
        '402': { description: Payment Required — insufficient credits, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Not Found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Invalid state transition, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
