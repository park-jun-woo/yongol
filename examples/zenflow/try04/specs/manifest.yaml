apiVersion: yongol/v1
kind: Project
metadata:
  name: zenflow
backend:
  lang: go
  framework: gin
  module: github.com/park-jun-woo/zenflow
  middleware:
    - bearerAuth
  auth:
    type: jwt
    mode: bearer
    secret_env: JWT_SECRET
    user_table: users
    roles:
      - admin
      - member
    claims:
      ID: id:string
      Email: email
      Role: role
      OrgID: org_id
frontend:
  lang: typescript
  framework: react
  bundler: vite
  name: zenflow-web
